{% extends "base.html" %}

{% block contenido %}
<h1>Nueva Tarea</h1>

<form action="/tareas/crear" method="POST" class="card p-4">
    <label>Título</label>
    <input class="form-control mb-3" name="titulo" required>

    <label>Categoría</label>
    <select class="form-select mb-3" name="categoria_id" required>
        <option value="">Selecciona una categoría</option>
        {% for categoria in categorias %}
            <option value="{{ categoria.id }}">{{ categoria.nombre }}</option>
        {% endfor %}
    </select>

    <label>Prioridad</label>
    <select class="form-select mb-3" name="prioridad" required>
        <option value="">Selecciona prioridad</option>
        <option>Alta</option>
        <option>Media</option>
        <option>Baja</option>
    </select>

    <label>Fecha límite</label>
    <input class="form-control mb-3" type="date" name="fecha_limite" required>

    <label>Descripción</label>
    <textarea class="form-control mb-3" name="descripcion" rows="5" required></textarea>

    <button class="btn btn-dark">Guardar</button>
    <a class="btn btn-secondary mt-2" href="/dashboard">Cancelar</a>
</form>
{% endblock %}
