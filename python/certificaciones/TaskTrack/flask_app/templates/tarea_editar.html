{% extends "base.html" %}

{% block contenido %}
<h1>Editar Tarea</h1>

<form action="/tareas/editar/{{ tarea.id }}" method="POST" class="card p-4">
    <label>Título</label>
    <input class="form-control mb-3" name="titulo" value="{{ tarea.titulo }}" required>

    <label>Categoría</label>
    <select class="form-select mb-3" name="categoria_id" required>
        {% for categoria in categorias %}
            <option value="{{ categoria.id }}" {% if categoria.id == tarea.categoria_id %}selected{% endif %}>
                {{ categoria.nombre }}
            </option>
        {% endfor %}
    </select>

    <label>Prioridad</label>
    <select class="form-select mb-3" name="prioridad" required>
        {% for prioridad in ['Alta', 'Media', 'Baja'] %}
            <option {% if tarea.prioridad == prioridad %}selected{% endif %}>{{ prioridad }}</option>
        {% endfor %}
    </select>

    <label>Fecha límite</label>
    <input class="form-control mb-3" type="date" name="fecha_limite" value="{{ tarea.fecha_limite }}" required>

    <label>Estado</label>
    <select class="form-select mb-3" name="estado">
        {% for estado in ['Pendiente', 'En progreso', 'Completada'] %}
            <option {% if tarea.estado == estado %}selected{% endif %}>{{ estado }}</option>
        {% endfor %}
    </select>

    <label>Descripción</label>
    <textarea class="form-control mb-3" name="descripcion" rows="5" required>{{ tarea.descripcion }}</textarea>

    <button class="btn btn-dark">Actualizar</button>
    <a class="btn btn-secondary mt-2" href="/dashboard">Cancelar</a>
</form>
{% endblock %}
