<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Juego del Destino</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="d-flex align-items-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

                <div class="card card-custom border-0 shadow-lg overflow-hidden">

                    <div class="header-custom text-center text-white py-4 position-relative">
                        <div
                            class="icon-header-wrapper d-inline-flex align-items-center justify-content-center rounded-circle mb-2">
                            <i class="bi bi-moon-fill text-white fs-4"></i>
                        </div>
                        <h1 class="h3 fw-semibold m-0 mb-1">El Juego del Destino</h1>
                        <p class="small text-white-50 m-0 text-opacity-75">Descubre qué te depara el futuro</p>
                    </div>

                    <div class="card-body bg-white px-4 px-md-5 pt-4 pb-5 position-relative">
                        <form action="/enviar" method="POST">

                            <div class="mb-3 position-relative">
                                <span class="input-icon-custom"><i class="bi bi-person-fill"></i></span>
                                <input type="text" name="nombre" class="form-control form-control-custom"
                                    placeholder="Tu nombre" required>
                            </div>

                            <div class="mb-3 position-relative">
                                <span class="input-icon-custom"><i class="bi bi-calendar3"></i></span>
                                <input type="number" name="edad" class="form-control form-control-custom"
                                    placeholder="Tu edad" required>
                            </div>

                            <div class="mb-3 position-relative">
                                <span class="input-icon-custom"><i class="bi bi-palette-fill"></i></span>
                                <input type="text" name="color" class="form-control form-control-custom"
                                    placeholder="Tu color favorito" required>
                                <div class="form-text text-muted-custom px-2 mt-1">Ej. rojo, azul, verde, morado,
                                    amarillo...</div>
                            </div>

                            <div class="mb-4 position-relative">
                                <span class="input-icon-custom"><i class="bi bi-dot"></i></span>
                                <input type="text" name="animal" class="form-control form-control-custom"
                                    placeholder="Tu animal favorito" required>
                                <div class="form-text text-muted-custom px-2 mt-1">Ej. perro, gato, águila, león,
                                    delfín...</div>
                            </div>

                            <div class="text-center my-4">
                                <div class="crystal-ball mx-auto">
                                    <img class="img-fluid"
                                        src="{{ url_for('static', filename = 'img/bola_de_cristal.webp') }}"
                                        alt="Bola de Cristal">
                                </div>
                            </div>

                            <button type="submit"
                                class="btn btn-submit-custom w-100 d-flex align-items-center justify-content-center gap-2 fw-semibold text-white py-2 rounded-3 border-0">
                                <i class="bi bi-magic"></i> Revelar mi destino
                            </button>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
