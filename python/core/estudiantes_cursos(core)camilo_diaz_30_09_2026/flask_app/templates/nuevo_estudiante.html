<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Estudiante</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/cursos">Gestión Académica</a>
        </div>
    </nav>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h1 class="h3 mb-4">Nuevo Estudiante</h1>
                        <form action="/estudiantes/crear" method="POST">
                            <div class="mb-3">
                                <label for="curso_id" class="form-label">Curso</label>
                                <select id="curso_id" name="curso_id" class="form-select" required>
                                    <option value="">Selecciona un curso</option>
                                    {% for curso in cursos %}
                                    <option value="{{ curso.id }}">{{ curso.nombre }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" id="nombre" name="nombre" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="apellido" class="form-label">Apellido</label>
                                <input type="text" id="apellido" name="apellido" class="form-control" required>
                            </div>
                            <div class="mb-4">
                                <label for="edad" class="form-label">Edad</label>
                                <input type="number" id="edad" name="edad" class="form-control" min="1" required>
                            </div>
                            <button type="submit" class="btn btn-success me-2">Crear</button>
                            <a href="/cursos" class="btn btn-outline-secondary">Inicio</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
