{% extends "base.html" %}

{% block contenido %}
<div class="row justify-content-center mt-5">
    <div class="col-md-10 col-lg-9">
        <div class="text-center mb-4">
            <h1 class="fw-bold">✓ TaskTrack</h1>
            <p>Organiza tus tareas y proyectos</p>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card p-4 shadow-sm">
                    <h3>Crear Cuenta</h3>
                    <form action="/registro" method="POST">
                        <input class="form-control mb-2" name="nombre" placeholder="Nombre" required>
                        <input class="form-control mb-2" name="apellido" placeholder="Apellido" required>
                        <input class="form-control mb-2" type="email" name="email" placeholder="E-mail" required>
                        <input class="form-control mb-2" type="password" name="password" placeholder="Contraseña" required>
                        <input class="form-control mb-3" type="password" name="confirmar" placeholder="Confirmar contraseña" required>
                        <button class="btn btn-dark w-100">Registrarse</button>
                    </form>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card p-4 shadow-sm">
                    <h3>Iniciar Sesión</h3>
                    <form action="/login" method="POST">
                        <input class="form-control mb-3" type="email" name="email" placeholder="E-mail" required>
                        <input class="form-control mb-3" type="password" name="password" placeholder="Contraseña" required>
                        <button class="btn btn-dark w-100">Iniciar Sesión</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
