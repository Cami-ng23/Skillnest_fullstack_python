{% extends "base.html" %}

{% block title %}Nuevo Alumno{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body">

                <h1 class="h3 mb-4">Nuevo Alumno</h1>

                <form action="{{ url_for('agregar_alumno') }}" method="POST">

                    <div class="mb-3">
                        <label for="materia_id" class="form-label">
                            Materia
                        </label>

                        <select
                            id="materia_id"
                            name="materia_id"
                            class="form-select"
                            required
                        >
                            <option value="">Selecciona una materia</option>

                            {% for materia in materias %}
                                <option value="{{ materia.id }}">
                                    {{ materia.nombre }}
                                </option>
                            {% endfor %}

                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="nombre" class="form-label">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="apellido" class="form-label">
                            Apellido
                        </label>

                        <input
                            type="text"
                            id="apellido"
                            name="apellido"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="edad" class="form-label">
                            Edad
                        </label>

                        <input
                            type="number"
                            id="edad"
                            name="edad"
                            class="form-control"
                            min="1"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-success">
                        Crear
                    </button>

                    <a
                        href="{{ url_for('materias') }}"
                        class="btn btn-outline-secondary"
                    >
                        Inicio
                    </a>

                </form>

            </div>
        </div>
    </div>

</div>

{% endblock %}
