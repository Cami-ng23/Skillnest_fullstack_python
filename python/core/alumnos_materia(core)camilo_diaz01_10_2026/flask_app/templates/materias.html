{% extends "base.html" %}

{% block title %}Materias{% endblock %}

{% block content %}

<div class="row g-4">

    <div class="col-lg-5">
        <div class="card shadow-sm h-100">
            <div class="card-body">

                <h1 class="h3 mb-4">Nueva Materia</h1>

                <form action="{{ url_for('agregar_materia') }}" method="POST">

                    <div class="mb-3">
                        <label for="nombre" class="form-label">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            class="form-control"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-success">
                        Crear
                    </button>

                </form>

            </div>
        </div>
    </div>

    <div class="col-lg-7">
        <div class="card shadow-sm h-100">
            <div class="card-body">

                <h2 class="h3 mb-4">Materias registradas</h2>

                {% if materias %}

                    <div class="list-group">

                        {% for materia in materias %}

                            <a
                                href="{{ url_for('ver_materia', id=materia.id) }}"
                                class="list-group-item list-group-item-action"
                            >
                                {{ materia.nombre }}
                            </a>

                        {% endfor %}

                    </div>

                {% else %}

                    <div class="alert alert-info">
                        No existen materias registradas.
                    </div>

                {% endif %}

                <div class="mt-4">
                    <a
                        href="{{ url_for('nuevo_alumno') }}"
                        class="btn btn-primary"
                    >
                        Agregar Alumno
                    </a>
                </div>

            </div>
        </div>
    </div>

</div>

{% endblock %}
